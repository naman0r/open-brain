[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-brain"
version = "1.0.0"
description = "MCP server over a local markdown context vault"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.1.0",
  "pyyaml>=6.0",
  "pydantic-settings>=2.5.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[project.scripts]
context-vault-mcp = "app.mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
